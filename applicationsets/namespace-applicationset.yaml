apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: idp-namespace-requests
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/sasunmadhuranga/idp-platform.git
        revision: main
        files:
          - path: "environments/requests/*.yaml"

  template:
    metadata:
      name: "idp-{{team_name}}-{{environment}}"
      labels:
        platform.io/managed-by: idp
    spec:
      project: default
      source:
        repoURL: https://github.com/sasunmadhuranga/idp-platform.git
        targetRevision: main
        path: "environments/rendered/{{team_name}}-{{environment}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{team_name}}-{{environment}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
